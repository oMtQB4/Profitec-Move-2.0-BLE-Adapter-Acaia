name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main: it may be creating a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The container image (espressif/idf:v5.4.4) appears in the test and build jobs;
# keep it in sync with IDF_VERSION in the Makefile. Runners are pinned to an
# Ubuntu release so a new ubuntu-latest can't change the build unannounced.
jobs:
  test:
    name: Host unit tests
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.4.4
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Build tests
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          cmake -S test -B build-test -G Ninja
          cmake --build build-test

      - name: Run tests
        run: ./build-test/host_tests

  web-test:
    name: Updater tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test web/updater/protocol.test.mjs

  build:
    name: Firmware (ESP32-S3)
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.4.4
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Cache managed components
        uses: actions/cache@v6
        with:
          path: managed_components
          key: components-${{ hashFiles('dependencies.lock') }}

      - name: Build
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          idf.py build
          idf.py merge-bin

      # The two images users need, named for what they're for.
      - name: Name images
        run: |
          cp build/merged-binary.bin build/acaia-bridge-esp32s3-to_flash_via_usb.bin
          cp build/acaia-bridge.bin build/acaia-bridge-esp32s3-ota_update.bin

      - name: Size report
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          {
            echo '```'
            idf.py size
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: acaia-bridge-esp32s3-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/acaia-bridge-esp32s3-to_flash_via_usb.bin
            build/acaia-bridge-esp32s3-ota_update.bin
            build/acaia-bridge.bin
            build/acaia-bridge.elf
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/flash_args

  # release-please keeps a release PR up to date from the Conventional Commits on
  # main (version.txt + CHANGELOG.md). Merging that PR raises the version; the
  # next run on main then tags vX.Y.Z and creates the GitHub release.
  release:
    name: Release
    needs: [test, web-test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Attaches the firmware built by the build job of this run (same commit as the
  # tag), so the release ships exactly what CI tested.
  publish:
    name: Publish firmware
    needs: [build, release]
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: acaia-bridge-esp32s3-${{ github.sha }}
          path: firmware

      # Attached on their own: the complete image for USB flashing and the app
      # image for updates over Bluetooth. Plus one zip with both, a flashing
      # guide (release/README.md, placeholders filled in), the changelog and
      # the separate parts.
      - name: Package
        run: |
          name="acaia-bridge-esp32s3-${TAG}"
          mkdir -p "dist/${name}/parts"
          for kind in to_flash_via_usb ota_update; do
            cp "firmware/acaia-bridge-esp32s3-${kind}.bin" "dist/${name}-${kind}.bin"
            cp "firmware/acaia-bridge-esp32s3-${kind}.bin" "dist/${name}/${name}-${kind}.bin"
          done
          (cd firmware && cp -r bootloader partition_table acaia-bridge.bin acaia-bridge.elf ota_data_initial.bin flash_args "../dist/${name}/parts/")
          sed -e "s|{{VERSION}}|${TAG}|g" \
              -e "s|{{REPOSITORY_URL}}|${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}|g" \
              release/README.md > "dist/${name}/README.md"
          cp CHANGELOG.md LICENSE "dist/${name}/"
          (cd dist && zip -r "${name}.zip" "${name}")

      - name: Upload release assets
        run: |
          name="acaia-bridge-esp32s3-${TAG}"
          gh release upload "$TAG" "dist/${name}-to_flash_via_usb.bin" "dist/${name}-ota_update.bin" "dist/${name}.zip" \
            --repo "$GITHUB_REPOSITORY" --clobber

  # The Bluetooth updater on GitHub Pages, with the latest release's -ota_update.bin
  # next to it (browsers can't download release assets from another origin).
  # Runs after every push to main, so page changes and new releases go live.
  # Needs Settings -> Pages -> Source: "GitHub Actions".
  pages:
    name: Deploy updater
    needs: [release, publish]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.publish.result != 'failure' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Assemble site
        run: |
          mkdir -p site/firmware
          cp web/updater/index.html web/updater/updater.js web/updater/protocol.js site/
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          file="acaia-bridge-esp32s3-${tag}-ota_update.bin"
          if [ -n "$tag" ] && gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
                --pattern "$file" --dir site/firmware; then
            date=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq '.publishedAt[:10]')
            jq -n --arg version "$tag" --arg file "$file" --arg date "$date" \
                  --arg sha256 "$(sha256sum "site/firmware/$file" | cut -d' ' -f1)" \
                  --argjson size "$(stat -c %s "site/firmware/$file")" \
                  '{version: $version, file: $file, date: $date, size: $size, sha256: $sha256}' \
                  > site/firmware/manifest.json
            cat site/firmware/manifest.json
          else
            echo "No release with an OTA image yet: the page offers file upload only."
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
